name: Meetly_Frontend_CI

on:
  push:
    branches:
      - main

env:
  APP_NAME: Meetly-Frontend
  IMAGE_NAME: meetly_frontend

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Verify API URL is set
        run: test -n "${{vars.VITE_API_URL}}" || (echo "VITE_API_URL is not set" && exit 1)

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{vars.VITE_API_URL}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}

      - name: Build Docker image
        run: >
          docker build
          --build-arg VITE_API_URL="${{vars.VITE_API_URL}}"
          -t ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:${{github.sha}} .

      - name: Push Docker image
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:${{github.sha}}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{env.APP_NAME}}
          publish-profile: ${{secrets.AZURE_WEBAPP_PUBLISH_PROFILE}}
          images: ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:${{github.sha}}
